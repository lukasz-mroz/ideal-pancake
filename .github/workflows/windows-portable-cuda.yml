name: Windows portable build (CUDA)

# Same portable package as windows-portable.yml, but with whisper.cpp built
# against CUDA, so transcription runs on an NVIDIA GPU. The runner has no GPU -
# it only compiles - so the result can only be verified on a machine with one.
#
# The package carries the CUDA runtime DLLs, so the target machine needs an
# NVIDIA driver but not the CUDA Toolkit.

on:
  workflow_dispatch:
    inputs:
      whisper_model:
        description: Whisper model to bundle for offline transcription
        type: choice
        default: large-v3
        options:
          - large-v3-turbo
          - large-v3
          - distil-large-v3.5
          - none
      include_webview2:
        description: Bundle the WebView2 runtime installer (works without internet)
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      WHISPER_MODEL: ${{ github.event.inputs.whisper_model || 'large-v3' }}
      INCLUDE_WEBVIEW2: ${{ github.event.inputs.include_webview2 || 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: cuda

      # Installs nvcc and the cuBLAS headers the whisper.cpp CUDA backend needs.
      # If the build fails on a missing CUDA component, widen sub-packages or
      # switch to method: 'local' (downloads the full ~3 GB installer).
      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.5.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      # whisper-rs-sys compiles whisper.cpp with cmake and generates bindings
      # with bindgen, which needs libclang.dll. Both ship with the runner
      # image; install LLVM only if it is missing.
      - name: Ensure cmake and LLVM are available
        shell: pwsh
        run: |
          cmake --version
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\libclang.dll')) {
            choco install llvm -y --no-progress
          }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The TipTap stack is on v2; a stray v3 dependency used to break peer
      # resolution here. Keep a fallback so a lockfile left over from an older
      # resolution does not fail the build.
      - name: Install npm dependencies
        shell: bash
        run: |
          npm install --no-audit --no-fund || {
            echo "::warning::npm install failed - retrying without package-lock.json"
            rm -f package-lock.json
            npm install --no-audit --no-fund --legacy-peer-deps
          }

      # `npm run build` runs tsc first; fall back to a plain vite build so a
      # type error in unrelated code does not block a release build.
      - name: Build frontend
        shell: bash
        run: npm run build || (echo "::warning::tsc failed - building with vite only" && npx vite build)

      # Build the binary with cargo directly (no tauri CLI): the `portable`
      # feature pins all data next to the executable, `custom-protocol` embeds
      # the frontend from ../dist.
      - name: Build Platypus (release, portable, CUDA)
        run: cargo build --release --features "custom-protocol portable cuda" --manifest-path src-tauri/Cargo.toml

      - name: Package portable bundle
        shell: pwsh
        run: |
          ./scripts/package-portable.ps1 `
            -WhisperModel "$env:WHISPER_MODEL" `
            -IncludeWebView2 ([System.Convert]::ToBoolean("$env:INCLUDE_WEBVIEW2")) `
            -IncludeCudaRuntime

      - name: Show package contents
        shell: pwsh
        run: Get-ChildItem dist-portable -Recurse | Select-Object FullName, Length

      # compression-level 0: the zip is already compressed, and the Whisper
      # model does not compress further.
      - uses: actions/upload-artifact@v4
        with:
          name: platypus-portable-windows-x64-cuda
          path: dist-portable/*.zip
          compression-level: 0
          retention-days: 14
